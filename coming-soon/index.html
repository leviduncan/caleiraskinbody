<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CALÉIRA Skin &amp; Body | Opening soon</title>
<meta name="description" content="CALÉIRA is a skin and body studio, opening soon.">
<meta name="robots" content="index, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Jost:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --coquina: #F5EEE3;
    --cocoa: #2A1A13;
    --mahogany: #5A2A1B;
    --champagne: #C8A675;
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--coquina); }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    background: var(--coquina);
    color: var(--cocoa);
    font-family: "Jost", system-ui, sans-serif;
    font-size: 17px;
    font-weight: 400;
    line-height: 1.6;
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 560px; }
  h1 {
    font-family: "Bodoni Moda", Didot, "Times New Roman", serif;
    font-optical-sizing: none;
    font-variation-settings: "opsz" 11;
    font-weight: 700;
    font-size: clamp(2.25rem, 11vw, 4rem);
    letter-spacing: 0.14em;
    /* The trailing letter-spacing would push the wordmark off center. */
    padding-left: 0.14em;
    line-height: 1.1;
  }
  .rule {
    width: 64px;
    height: 1px;
    margin: 28px auto;
    background: var(--champagne);
    border: 0;
  }
  .tagline {
    font-family: "Bodoni Moda", Didot, "Times New Roman", serif;
    font-optical-sizing: none;
    font-variation-settings: "opsz" 11;
    font-style: italic;
    font-weight: 400;
    font-size: 1.35rem;
  }
  .line { margin-top: 12px; }
  .book {
    display: inline-block;
    margin-top: 32px;
    padding: 14px 32px;
    background: var(--mahogany);
    color: var(--coquina);
    font: inherit;
    letter-spacing: 0.06em;
    text-decoration: none;
    border-radius: 999px;
  }
  .book:hover { background: var(--cocoa); }
  .book:focus-visible { outline: 2px solid var(--mahogany); outline-offset: 3px; }
  @media (min-width: 768px) {
    body { font-size: 17px; }
    .tagline { font-size: 1.6rem; }
  }
</style>
</head>
<body>
<main>
  <h1>CALÉIRA</h1>
  <hr class="rule">
  <p class="tagline">Designed to Be Noticed.</p>
  <p class="line">Skin and body studio, opening soon.</p>
  <a class="book" href="https://cal.com/caleira">Book Now</a>
</main>
</body>
</html>
